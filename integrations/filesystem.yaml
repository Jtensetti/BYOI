# kind: mcp – en färdig MCP-server från npm. Avstängd som standard.
id: filesystem
name: Filsystem
description: Läs filer i en utvald katalog
kind: mcp
enabled: false
transport:
  type: stdio
  command: npx
  args: ["-y", "@modelcontextprotocol/server-filesystem", "${env:HOME}"]
confirm: [write_file, edit_file, move_file, create_directory]
