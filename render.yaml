# Render Blueprint: https://render.com/deploy?repo=https://github.com/Jtensetti/BYOI
services:
  - type: web
    name: byoi
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # you are asked for it when deploying
      - key: BYOI_API_TOKEN
        generateValue: true  # the access password; find it under Environment
